name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.sha }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v$VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/ecylmz/cx/internal/cx.Version=$VERSION" \
              -o "dist/cx-$1-$2" ./cmd/cx
          }
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          chmod 0755 dist/cx-*
          (cd dist && sha256sum cx-* > SHA256SUMS)

      - name: Publish
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            git fetch --quiet origin main
            CURRENT="$(git show origin/main:VERSION | tr -d '[:space:]')"
            if [[ "v$CURRENT" != "$TAG" ]]; then
              echo "skip stale release $TAG; main declares v$CURRENT"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          args=(
            "$TAG"
            dist/cx-darwin-arm64
            dist/cx-darwin-amd64
            dist/cx-linux-amd64
            dist/cx-linux-arm64
            dist/SHA256SUMS
            --generate-notes
            --title "$TAG"
          )
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        if: steps.publish.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TAP_REPO: ecylmz/homebrew-tap
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_DISPATCH_TOKEN is unset; cannot update the tap" >&2
            exit 1
          fi
          gh workflow run update-formula.yml \
            --repo "$TAP_REPO" \
            --field formula=cx \
            --field tag="$TAG" \
            --field repository="$GITHUB_REPOSITORY"
          echo "dispatched $TAP_REPO update for $TAG"
          echo "https://github.com/$TAP_REPO/actions/workflows/update-formula.yml"
