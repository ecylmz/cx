name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate installer
        run: sh -n install.sh
      - name: Source install smoke test
        shell: bash
        run: |
          set -euo pipefail
          CX_BUILD_FROM_SOURCE=1 CX_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh
          "$RUNNER_TEMP/bin/cx" version

  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch test dependencies
        run: pacman -Sy --noconfirm git go
      - uses: actions/checkout@v4
      - name: Validate installer
        run: sh -n install.sh
      - name: Omarchy/Arch installer smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /usr/share/omarchy/default/bash
          cat > /usr/share/omarchy/default/bash/aliases <<'EOF'
          alias cx='printf "\\033[2J\\033[3J\\033[H" && claude --permission-mode auto'
          EOF
          cat > "$HOME/.bashrc" <<'EOF'
          source /usr/share/omarchy/default/bash/aliases
          EOF

          CX_BUILD_FROM_SOURCE=1 CX_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh
          "$RUNNER_TEMP/bin/cx" version

          test "$(grep -Fc '# >>> cx Omarchy override >>>' "$HOME/.bashrc")" -eq 1
          grep -Fq 'unalias cx 2>/dev/null || true' "$HOME/.bashrc"
          PATH="$RUNNER_TEMP/bin:$PATH" bash --noprofile --rcfile "$HOME/.bashrc" -ic '
            test "$(type -t cx)" = file
            cx version >/dev/null
          '

          CX_BUILD_FROM_SOURCE=1 CX_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh
          test "$(grep -Fc '# >>> cx Omarchy override >>>' "$HOME/.bashrc")" -eq 1
